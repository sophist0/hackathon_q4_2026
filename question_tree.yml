tree_id: user_prompt_v1
input_class: User Prompt
system:
  id: adder_8bit_v1
  name: "8-bit adder microservice"
  spec_ref: "data/8bit_adder_spec.txt"
  context: inline  # adder spec is bespoke; decider injects spec_ref text
  # Swap for Linux: { id: linux_os_v1, name: "Linux OS",
  #   spec_ref: null, context: assumed_known }.
target_labels: [Unknowable, Verifiable Minimal, Verifiable, Unverifiable Minimal, Unverifiable]
max_depth: 3
stop_rules:
  - "N at q1 ends the chain"
  - "Spark abstain at any step ends the chain as abstained"
questions:
  - id: q1
    text: "Is the prompt answerable by the system according to its specification? (Y/N)"
    on_Y: q2
    on_N: end_Unknowable

  - id: q2
    # text: "Does the prompt ask the service to perform an action, rather than asking about the service itself (its logs, timestamps, data, other users, etc.)? (Y/N)"
    # text: "Does the prompt ask the service to perform an action with a checkable result, rather than asking about things only the service itself could tell you (whether its logs are complete or accurate, what other users did, what time it is)? (Y/N)"
    text: "Does the prompt ask the service to perform an action with a checkable result, and not about things that require perfect knowledge of the service (such as whether the services logs are complete or accurate, what other users did, timestamp accuracy, etc.)? (Y/N)"
    on_Y: q3
    on_N: q4

  - id: q3
    text: "Given the system specification is every request in the LLM_response required for the prompt's task? (Y/N)"
    on_Y: end_Verifiable_Minimal
    on_N: end_Verifiable

  - id: q4
    text: "Given the system specification is every request in the LLM_response required for the prompt's task? (Y/N)"
    on_Y: end_Unverifiable_Minimal
    on_N: end_Unverifiable